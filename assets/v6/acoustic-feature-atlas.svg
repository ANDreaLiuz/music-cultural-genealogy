    <g fill="#735488"><circle cx="474" cy="110" r="7"/><circle cx="490" cy="135" r="4"/><circle cx="461" cy="151" r="10"/></g>
  </g>
  <g fill="#735488">
    <rect x="72" y="267" width="12" height="44" rx="6"/><rect x="99" y="267" width="12" height="44" rx="6"/><rect x="126" y="267" width="12" height="44" rx="6"/>
    <circle cx="217" cy="289" r="14"/><circle cx="250" cy="289" r="7"/><circle cx="281" cy="289" r="14"/>
    <path d="M351 305L368 273L385 305ZM402 305L419 273L436 305Z"/>
    <circle cx="481" cy="276" r="5"/><circle cx="481" cy="300" r="5"/>
  </g>
