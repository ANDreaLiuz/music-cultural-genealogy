<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 550" role="img" aria-labelledby="title desc">
  <title id="title">Acoustic-feature atlas — conceptual illustration</title>
  <desc id="desc">Original abstract shapes suggest texture, repetition and layering as listening questions. These marks contain no recordings, waveforms, measurements or research features.</desc>
  <defs>
    <pattern id="dots" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.3" fill="#735488"/></pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V12" stroke="#735488" stroke-width="3"/></pattern>
  </defs>
  <rect width="560" height="550" fill="#eee8f1"/>
  <g fill="none" stroke="#d4c7dc"><path d="M28 41H532M28 510H532M28 41V510M532 41V510"/><path d="M52 185H508M52 337H508"/></g>
