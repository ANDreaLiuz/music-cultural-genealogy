    <text x="52" y="75">TEXTURE</text><text x="52" y="227">REPETITION</text><text x="52" y="379">LAYERING</text>
  </g>
  <g>
    <circle cx="105" cy="132" r="33" fill="url(#dots)"/>
    <rect x="206" y="101" width="64" height="64" rx="3" fill="url(#hatch)"/>
