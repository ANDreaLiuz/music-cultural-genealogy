<rect width="1200" height="470" fill="#fafbf8"/>
<text x="42" y="48" fill="#76618f" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">MUSIC CULTURAL GENEALOGY / CONCEPTUAL RESEARCH MAP</text>
<text x="42" y="98" fill="#142435" font-family="Arial,sans-serif" font-size="32">A graph is a question about relationships.</text>
<g fill="white" stroke="#d8ded9"><rect x="42" y="140" width="252" height="126" rx="9"/><rect x="335" y="140" width="252" height="126" rx="9"/><rect x="628" y="140" width="252" height="126" rx="9"/></g>
<g stroke="#75608e" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M300 203H327"/><path d="M593 203H620"/></g>
<g font-family="Arial,sans-serif" fill="#142435"><text x="62" y="176" font-size="19">01  Recording</text><text x="62" y="207" font-size="15">Identity · temporal context</text><text x="62" y="232" font-size="15">Rights · production context</text><text x="355" y="176" font-size="19">02  Representation</text><text x="355" y="207" font-size="15">Audio descriptors · embeddings</text><text x="355" y="232" font-size="15">Distance · normalization</text><text x="648" y="176" font-size="19">03  Estimated relations</text><text x="648" y="207" font-size="15">Neighbors · communities</text><text x="648" y="232" font-size="15">Hierarchy · uncertainty</text></g>
