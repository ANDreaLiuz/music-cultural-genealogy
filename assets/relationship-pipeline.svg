<g fill="#142435" font-family="Arial,sans-serif"><text x="62" y="375" font-size="18">Independent validation is a separate research step.</text><text x="62" y="400" font-size="15">Perceptual judgments ≠ historical evidence ≠ longitudinal preference ≠ causal influence</text><text x="944" y="184" font-size="16">Exploratory</text><text x="944" y="210" font-size="16">computation</text><text x="944" y="247" font-size="14" fill="#596671">Validation pending</text><text x="42" y="449" font-size="13" fill="#596671">Conceptual diagram. Arrows do not assert a completed, validated or causal pipeline. Original portfolio artwork.</text></g>
