<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">From recordings to relationships, with independent validation</title><desc id="desc">An original conceptual diagram: a recording feeds representations, then exploratory neighbors and communities. Independent perception, historical sources and longitudinal evidence are separate checks. Arrows indicate a research argument, not a completed validated pipeline.</desc>
